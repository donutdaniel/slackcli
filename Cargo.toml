[package]
name = "slackcli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust CLI for the Slack Web API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/donutdaniel/slackcli"
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/COVERAGE.md",
    "/BENCHMARKS.md",
    "/slack-app-manifest.json",
    "/scripts/*.json",
    "/scripts/*.py",
    "/scripts/*.sh",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yaml_serde = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
